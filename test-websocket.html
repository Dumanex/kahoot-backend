<!DOCTYPE html>
<html lang="">
<head>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 20px auto; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .controls input { padding: 5px; }
        .controls button { padding: 5px 15px; cursor: pointer; }
        #log { background: #1e1e1e; color: #d4d4d4; padding: 15px; height: 400px; overflow: auto; border-radius: 5px; white-space: pre-wrap; }
        .section { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
    </style>
</head>
<body>
<div class="section">
    <strong>Connection:</strong>
    <div class="controls">
        <label>PIN:</label>
        <input id="pin" value="123456" />
        <label>Nickname:</label>
        <input id="nickname" value="Player1" />
        <button onclick="connect()">Connect</button>
        <button onclick="join()">Join</button>
    </div>
</div>

<div class="section">
    <strong>Player Info (auto-filled after join):</strong>
    <div class="controls">
        <label>Player ID:</label>
        <input id="playerId" value="" readonly style="background:#e0e0e0;" />
    </div>
</div>

<div class="section">
    <strong>Host Controls:</strong>
    <div class="controls">
        <button onclick="start()">Start Game</button>
        <button onclick="next()">Next Question</button>
        <button onclick="endGame()">End Game</button>
    </div>
</div>

<div class="section">
    <strong>Answer Controls:</strong>
    <div class="controls">
        <label>Question ID:</label>
        <input id="questionId" value="" readonly style="background:#e0e0e0;" />
        <label>Answer ID:</label>
        <input id="answerId" value="" />
        <label>Response (ms):</label>
        <input id="responseTimeMs" value="2000" type="number" />
        <button onclick="answer()">Submit Answer</button>
    </div>
</div>

<pre id="log"></pre>

<script>
    let stompClient = null;
    let currentPin = '';

    function log(msg) {
        const logEl = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        logEl.textContent += '[' + time + '] ' + msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
    }

    function connect() {
        currentPin = document.getElementById('pin').value;
        if (!currentPin) {
            log('ERROR: Enter PIN first!');
            return;
        }

        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = function(str) {}; // Disable debug

        stompClient.connect({}, (frame) => {
            log('✅ Connected!');

            const topics = ['/players', '/started', '/question', '/answer-result', '/leaderboard', '/ended', '/error'];
            topics.forEach(topic => {
                stompClient.subscribe('/topic/game/' + currentPin + topic, (msg) => {
                    handleMessage(topic, msg.body);
                });
            });
            log('📡 Subscribed to topics for PIN: ' + currentPin);
        }, (error) => {
            log('❌ Connection Error: ' + error);
        });
    }

    function handleMessage(topic, body) {
        log('[' + topic + '] ' + body);

        try {
            const data = JSON.parse(body);

            // Auto-fill Player ID from /players response
            if (topic === '/players' && Array.isArray(data) && data.length > 0) {
                const myNickname = document.getElementById('nickname').value;
                const me = data.find(p => p.nickname === myNickname) || data[0];
                document.getElementById('playerId').value = me.id;
                log('👤 Your Player ID set to: ' + me.id);
            }

            // Auto-fill Question ID from /question response
            if (topic === '/question' && data.id) {
                document.getElementById('questionId').value = data.id;
                // Pre-fill first answer ID as default
                if (data.answers && data.answers.length > 0) {
                    document.getElementById('answerId').value = data.answers[0].id;
                }
                log('❓ Question loaded: ' + data.questionText);
            }
        } catch (e) {
            // Ignore parse errors for non-JSON messages
        }
    }

    function send(dest, body) {
        if (!stompClient || !stompClient.connected) {
            log('❌ Not connected!');
            return;
        }
        stompClient.send('/app/game/' + currentPin + dest, {}, JSON.stringify(body));
        log('📤 Sent: ' + dest + ' ' + JSON.stringify(body));
    }

    function join() {
        const nickname = document.getElementById('nickname').value;
        if (!nickname) {
            log('ERROR: Enter nickname!');
            return;
        }
        send('/join', { nickname: nickname });
    }

    function start() { send('/start', {}); }
    function next() { send('/next', {}); }
    function endGame() { send('/end', {}); }

    function answer() {
        const playerId = parseInt(document.getElementById('playerId').value);
        const questionId = parseInt(document.getElementById('questionId').value);
        const answerId = parseInt(document.getElementById('answerId').value);
        const responseTimeMs = parseInt(document.getElementById('responseTimeMs').value);

        if (!playerId) { log('❌ ERROR: Player ID not set! Join first.'); return; }
        if (!questionId) { log('❌ ERROR: Question ID not set! Wait for question.'); return; }
        if (!answerId) { log('❌ ERROR: Answer ID not set!'); return; }

        send('/answer', {
            playerId: playerId,
            questionId: questionId,
            answerId: answerId,
            responseTimeMs: responseTimeMs
        });
    }
</script>
</body>
</html>
